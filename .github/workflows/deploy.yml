name: Deploy

# main deploys to production only when the repo variable PRODUCTION_DEPLOY is 'true'.
# PR previews: preview.yml. The download links are read at build time, so a hikari
# release rebuilds the site (repository_dispatch from hikari's release workflow), with
# a daily rebuild as the backup.

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [hikari-release]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production:
    if: github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hikarisub.org
    steps:
      - uses: actions/checkout@v5
      # Stop before changing anything if the token can't manage both zones.
      - name: Check the Cloudflare token's scope
        run: scripts/cloudflare-scope.sh hikarisub.org altqx.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          VITE_CF_BEACON_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
      # The site takes hikarisub.org and lets go of hikarisub.altqx.com; then the redirect
      # Worker takes www.hikarisub.org and hikarisub.altqx.com.
      - run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the redirect Worker
        run: bunx wrangler deploy --config redirect/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
