name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck

      - name: Build with drafts (as PR previews do)
        run: bun run build
        env:
          VITE_SHOW_DRAFTS: "1"
      - name: Link check (with drafts)
        run: bun run check-links
      # Deployed by preview.yml, which runs from main with the Cloudflare secrets.
      - name: Keep the preview build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: .output/public
          include-hidden-files: true
          retention-days: 7

      - name: Build for production
        run: bun run build
      - name: Link check (production)
        run: bun run check-links

      - run: bunx playwright install --with-deps chromium
      - name: Playwright smoke
        run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
